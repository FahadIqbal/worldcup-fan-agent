apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: worldcup-fan-agent
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/description: "WorldCup Fan Command Center - AI travel agent for FIFA 2026"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: worldcup-agent-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: gcr.io/PROJECT_ID/worldcup-fan-agent:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
            requests:
              cpu: "1"
              memory: "512Mi"
          env:
            - name: NODE_ENV
              value: production
            - name: GCP_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: worldcup-secrets
                  key: gcp-project-id
            - name: GCP_REGION
              value: us-central1
            - name: GEMINI_MODEL
              value: gemini-1.5-pro-002
            - name: GEMINI_MAX_OUTPUT_TOKENS
              value: "4096"
            - name: GEMINI_TEMPERATURE
              value: "0.3"
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: worldcup-secrets
                  key: tavily-api-key
            - name: NEON_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: worldcup-secrets
                  key: neon-database-url
            - name: BROWSERBASE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: worldcup-secrets
                  key: browserbase-api-key
            - name: BROWSERBASE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: worldcup-secrets
                  key: browserbase-project-id
            - name: FIREBASE_ADMIN_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: worldcup-secrets
                  key: firebase-admin-project-id
            - name: FIREBASE_ADMIN_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: worldcup-secrets
                  key: firebase-admin-private-key
            - name: FIREBASE_ADMIN_CLIENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: worldcup-secrets
                  key: firebase-admin-client-email
            - name: FCM_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: worldcup-secrets
                  key: fcm-server-key
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: worldcup-secrets
                  key: resend-api-key
            - name: SCHEDULER_SERVICE_ACCOUNT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: worldcup-secrets
                  key: scheduler-sa-email
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
